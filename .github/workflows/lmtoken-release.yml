name: lmtoken release

# Build and publish lmtoken to a GitHub Release: the CLI is cross-compiled in
# one job (pure Go), while the Fyne GUI (LM Token) needs CGO/OpenGL and is
# built on a native runner per OS. Trigger by pushing a tag like
# `lmtoken-v1.0.0`, or run it manually from the Actions tab (supply the tag).
# Free on public repositories — the builds run on GitHub-hosted runners and
# the binaries are hosted on GitHub Releases.

on:
  push:
    tags:
      - 'lmtoken-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. lmtoken-v1.0.0)'
        required: true

permissions:
  contents: write  # needed to create the Release

jobs:
  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/lmtoken
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: tools/lmtoken/go.sum

      # `go test ./...` compiles the GUI package too, which needs the X11/GL
      # headers Fyne links against on Linux.
      - name: Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols

      - name: Test
        run: go test ./...

      - name: Cross-compile CLI + package (dist/*.zip)
        run: make package

      - uses: actions/upload-artifact@v7
        with:
          name: cli
          path: tools/lmtoken/dist/*.zip

  gui-darwin:
    runs-on: macos-latest  # arm64; the amd64 app is cross-built on the same runner
    defaults:
      run:
        working-directory: tools/lmtoken
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: tools/lmtoken/go.sum

      - name: Package LM Token.app (arm64 + amd64)
        run: |
          make package-gui
          GOARCH=amd64 CGO_ENABLED=1 make package-gui

      - uses: actions/upload-artifact@v7
        with:
          name: gui-darwin
          path: tools/lmtoken/dist/lmtoken-gui-darwin-*.zip

  gui-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/lmtoken
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: tools/lmtoken/go.sum

      - name: Fyne build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev wayland-protocols

      # fyne package on Linux emits a tar.xz (binary + .desktop + icon).
      - name: Package LM Token (linux amd64)
        run: |
          mkdir -p dist
          cd cmd/lmtoken-gui
          go run fyne.io/tools/cmd/fyne@latest package --release
          mv *.tar.xz ../../dist/lmtoken-gui-linux-amd64.tar.xz

      - uses: actions/upload-artifact@v7
        with:
          name: gui-linux
          path: tools/lmtoken/dist/lmtoken-gui-linux-*.tar.xz

  gui-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/lmtoken
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache-dependency-path: tools/lmtoken/go.sum

      # fyne package on Windows emits "LM Token.exe" (GUI subsystem, icon
      # embedded) next to the sources.
      - name: Package LM Token.exe (windows amd64)
        shell: pwsh
        run: |
          mkdir dist -Force
          cd cmd/lmtoken-gui
          go run fyne.io/tools/cmd/fyne@latest package --release
          Compress-Archive -Path 'LM Token.exe' -DestinationPath ../../dist/lmtoken-gui-windows-amd64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: gui-windows
          path: tools/lmtoken/dist/lmtoken-gui-windows-*.zip

  publish:
    needs: [cli, gui-darwin, gui-linux, gui-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && shasum -a 256 * > SHA256SUMS.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          files: |
            dist/*
          body: |
            **LM Token** fetches your La Marzocco machine's Bluetooth token: sign in with
            your La Marzocco account, pick your machine, and copy the token. See the
            repository README for what to do with it.

            - **LM Token app** (no terminal needed): `lmtoken-gui-<os>-<arch>` — unzip and
              double-click. macOS: the app is not notarized (no Apple developer
              subscription), so the first launch warns "Apple could not verify…" — click
              Done, then System Settings → Privacy & Security → **Open Anyway**. If macOS
              instead calls the app "damaged", run `xattr -cr "LM Token.app"` and open it
              again.
            - **lmtoken CLI** (for terminals and scripting): `lmtoken-<os>-<arch>` — unzip
              and run; prints the token to stdout.
