name: firmware release

# Build the firmware for every supported board and publish the flashable
# binaries to a GitHub Release + the web flasher on GitHub Pages.
# Trigger by pushing a tag like `v0.1.0`, or run it manually from the Actions
# tab (supply the tag). The `v*` prefix is firmware's; the lmtoken tool
# releases under `lmtoken-v*` (see lmtoken-release.yml).
#
# BETA CHANNEL: a tag of the form `vX.Y.Z-beta.N` publishes exactly the same way
# but as a GitHub PRE-release, and lands only in `releases-beta.json` — the
# stable `releases.json` that every fielded device reads stays releases-only.
# (Firmware older than the pre-release-aware parser would read "0.14.0-beta.1"
# as 0.14.0 and install a beta, so that separation is load-bearing, not tidiness.)
# Promoting a beta to stable is a REBUILD, never a copy of the artifacts:
# fw::kVersion is compiled into the image and asserted against the tag below, so
# a promoted binary would keep reporting its beta version and re-prompt forever.
# Bump include/version.h + CHANGELOG.md and tag the release proper.
#
# Each board's artifact is its PlatformIO `firmware.factory.bin` — a combined
# image (bootloader + partition table + app at their proper offsets) flashed
# at offset 0, which is exactly what ESP Web Tools wants: the Pages site
# (site/, deployed to the gh-pages branch with the binaries + generated
# manifests) lets anyone flash a board from Chrome with no toolchain.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.1.0, or v0.1.0-beta.1)'
        required: true

permissions:
  contents: write  # create the Release + push the gh-pages branch

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One board's transient failure must not cancel the other seven and skip
      # publishing. v0.12.1 died exactly that way: a 500 from the package CDN
      # while fetching esptoolpy took out the x-7 job, fail-fast cancelled the
      # rest, and `release`/`pages` were SKIPPED -- leaving a pushed tag with no
      # artifacts, which is worse than either shipping or not shipping.
      fail-fast: false
      matrix:
        include:
          # board = user-facing name (Waveshare product, lowercased) used in
          # the artifact filename; env = the PlatformIO environment.
          - { env: esp32-p4-micra-5,     board: p4-wifi6-touch-lcd-5,    chip: ESP32-P4 }
          - { env: esp32-p4-micra-43,    board: p4-wifi6-touch-lcd-4.3,  chip: ESP32-P4 }
          - { env: esp32-s3-micra-4-3c,  board: s3-touch-lcd-4.3c,       chip: ESP32-S3 }
          - { env: esp32-p4-micra-x-8,   board: p4-wifi6-touch-lcd-x-8,  chip: ESP32-P4 }
          # THIS LIST IS THE SUPPORT MATRIX. Four products are released and
          # advertised: the P4-5 (mount-on-Micra, the default pick), the P4-4.3
          # (same board, smaller glass), the S3-4.3C BOX (mount-on-Micra with
          # nothing to build) and the X 8" (counter-top). platformio.ini
          # carries five MORE envs - esp32-s3-micra, -7b, -4-3b,
          # esp32-p4-micra-x-7, -x-10-1 - which build fine and are kept as the
          # record of how those boards differ (and as the owner's own dev
          # hardware). They are deliberately NOT built here, NOT in
          # site/index.html, and NOT in the README. Do not add one back
          # without asking - see the "Support matrix" section of CLAUDE.md.
          #
          # COMING: rev v3 production silicon. Waveshare does NOT change the
          # SKU, so a buyer cannot tell which they got and the PRODUCT list
          # must stay four - the silicon split doubles the IMAGES, not the
          # boards. Each P4 product then has two rows, the plain slug meaning
          # rev v1.x ("es") and a -rev3 sibling (p4-wifi6-touch-lcd-5-rev3,
          # p4-wifi6-touch-lcd-4.3-rev3, ...), with the flasher picking
          # between them. Never rename a plain slug: fielded units self-update
          # from it.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          # The key still tracks platformio.ini so a real platform/lib change gets
          # a fresh cache -- but restore-keys means an unrelated edit no longer
          # forces a FULL re-download from the CDN: the previous cache for this
          # env is restored and only the delta is fetched. That matters because a
          # full fetch is when a transient CDN outage can take out a release (a
          # one-line monitor_dtr change invalidated all eight jobs' caches).
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install platformio

      # The device serves the shot-history browser from a gzipped C array
      # (include/platform_esp32/webapp_dist.h) that is GENERATED, not committed
      # — so the release builds it here, exactly as `make build` does locally.
      # Without this step the firmware won't compile.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'  # match the version developers build with
          cache: npm
          cache-dependency-path: tools/webapp/package-lock.json

      - name: Build the embedded web app
        run: tools/webapp/build.sh

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      - name: Stage artifact
        run: |
          mkdir -p out
          cp .pio/build/${{ matrix.env }}/firmware.factory.bin \
             "out/apollo2-${{ matrix.board }}-${RELEASE_TAG}.bin"
          # chip family for the web-flasher manifest generation
          echo "${{ matrix.chip }}" > "out/apollo2-${{ matrix.board }}-${RELEASE_TAG}.bin.chip"
          # The web flasher gets the SAME image split around the nvs partition,
          # so flashing keeps the paired machine, Wi-Fi and settings instead of
          # padding over them (see tools/stage_flash_parts.py). The single .bin
          # above stays the clean-install / recovery download.
          python3 tools/stage_flash_parts.py .pio/build/${{ matrix.env }} \
                  "out/parts/${{ matrix.board }}"
          # App-only image for the on-device self-updater (esp_https_ota
          # streams it into the inactive OTA slot; the parts above are NOT
          # usable for that — they bundle otadata with the app). The .sha256
          # sidecar is for humans/scripts; the device trusts TLS + the OTA
          # image validation.
          mkdir -p out/app
          cp .pio/build/${{ matrix.env }}/firmware.bin \
             "out/app/${{ matrix.board }}.bin"
          ( cd out/app && shasum -a 256 "${{ matrix.board }}.bin" \
              > "${{ matrix.board }}.bin.sha256" )
          # Guard the self-updater's URL contract: the slug baked into THIS
          # build as kUpdateSlug must be exactly this matrix row's board name,
          # or the device would fetch another board's image. Check the BINARY,
          # not board_config.h: every board's slug is present in that header
          # unconditionally, so grepping the source passes for every row no
          # matter which env was actually built (it did — that guard was a
          # no-op). Match the NUL-delimited literal, not a substring: slugs
          # nest (p4-wifi6-touch-lcd-5 sits inside ...-5-rev3), so a substring
          # test would pass the exact mix-up this is here to catch.
          python3 -c 'import sys; blob = open(sys.argv[1], "rb").read(); sys.exit(0 if blob.count(b"\0" + sys.argv[2].encode() + b"\0") == 1 else 1)' \
              "out/app/${{ matrix.board }}.bin" "${{ matrix.board }}" || {
            echo "::error::kUpdateSlug for ${{ matrix.env }} != '${{ matrix.board }}' - the self-updater would fetch the wrong image"; exit 1; }
          # Guard the self-updater's version contract: fw::kVersion baked into
          # THIS build must equal the release tag (minus the 'v'), or the
          # installed image reports the OLD version and the update check
          # re-prompts forever (v0.12.3 shipped exactly that way, 2026-09-10 —
          # the tag was cut without bumping include/version.h). Same
          # NUL-delimited literal match as the slug check above.
          python3 -c 'import sys; blob = open(sys.argv[1], "rb").read(); sys.exit(0 if blob.count(b"\0" + sys.argv[2].encode() + b"\0") >= 1 else 1)' \
              "out/app/${{ matrix.board }}.bin" "${RELEASE_TAG#v}" || {
            echo "::error::fw::kVersion in ${{ matrix.env }} != '${RELEASE_TAG#v}' - bump include/version.h before tagging"; exit 1; }
          # Debug symbols: this build's .elf, bundled into one archive by the
          # release job. A crash dump pulled off a device later
          # (http://<ip>/coredump) can only be symbolicated against the .elf
          # of the exact build that crashed — without archiving it here, a
          # release-build coredump is undecodable.
          mkdir -p out/elf
          cp .pio/build/${{ matrix.env }}/firmware.elf \
             "out/elf/apollo2-${{ matrix.board }}-${RELEASE_TAG}.elf"
          # Sidecar: this build's ELF-SHA fingerprint, read from the app
          # descriptor embedded in firmware.bin (magic 0xABCD5432 @0x20, sha
          # @0xB0). A dump downloaded from a device is named
          # coredump-<first 8 hex chars>.bin, so `grep <chars> *.appsha`
          # picks the matching .elf without trial-and-error.
          python3 - <<EOF
          import struct
          b = open(".pio/build/${{ matrix.env }}/firmware.bin", "rb").read()
          assert struct.unpack("<I", b[0x20:0x24])[0] == 0xABCD5432, "no app descriptor"
          with open("out/elf/apollo2-${{ matrix.board }}-${RELEASE_TAG}.elf.appsha", "w") as f:
              f.write(b[0xB0:0xD0].hex() + "\n")
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: fw-${{ matrix.board }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Needed for CHANGELOG.md, which supplies the release notes below. (This
      # job used to be artifacts-only — no checkout — so leaving it out makes
      # the notes step fail with an unhelpful "exit code 2".)
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: (cd dist && rm -f *.chip && shasum -a 256 *.bin > SHA256SUMS.txt)

      # One archive for all boards' .elf files (they're ~30 MB each raw, and
      # only ever needed to decode a coredump — no reason to clutter the
      # release's download list with six of them).
      - name: Bundle debug symbols
        run: |
          tar -C dist/elf -czf \
              "dist/apollo2-debug-symbols-${RELEASE_TAG}.tar.gz" .

      # Body = this version's CHANGELOG.md section + the constant install
      # instructions. The notes live in the repo (not in this file) so that
      # re-running the workflow for an existing tag — which republishes the
      # release — can't clobber hand-written notes, and so they're reviewed
      # with the code. A missing section is a loud warning, not a failure:
      # publishing binaries always wins over perfect prose.
      - name: Compose release notes
        run: |
          section() {
            awk -v tag="$1" '
              $0 == "## " tag { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          }
          section "${RELEASE_TAG}" > dist/NOTES.md
          # A beta usually documents itself under the version it is a beta OF,
          # so fall back to that section rather than shipping a beta with no
          # notes at all (the on-device modal shows this same text).
          BASE_TAG="${RELEASE_TAG%%-beta.*}"
          if [ ! -s dist/NOTES.md ] && [ "$BASE_TAG" != "$RELEASE_TAG" ]; then
            section "${BASE_TAG}" > dist/NOTES.md
          fi
          if [ ! -s dist/NOTES.md ]; then
            echo "::warning::CHANGELOG.md has no '## ${RELEASE_TAG}' section - publishing with install notes only"
          fi
          case "${RELEASE_TAG}" in
            *-beta.*)
              cat >> dist/NOTES.md <<'EOF'

          > **Pre-release.** Devices only see this if **Settings > Apollo > WiFi >
          > Beta updates** is on, or if it is flashed deliberately from the web
          > flasher with "Include pre-releases" ticked.
          EOF
              ;;
          esac
          cat >> dist/NOTES.md <<EOF

          ---

          Apollo 2 firmware ${RELEASE_TAG} — one flashable image per supported
          Waveshare board (bootloader + partitions + app combined; flash at
          offset 0).

          **Easiest install: the [web flasher](https://mlsorensen.github.io/Apollo2/)** —
          plug the board in and flash from Chrome, no tools needed.

          The flasher upgrades in place: your paired machine, Wi-Fi and
          settings survive unless you explicitly choose to erase.

          Command-line alternative — note the attached \`.bin\` is a **full
          image**, so flashing it this way DOES clear saved settings:
          \`\`\`
          esptool.py write_flash 0 apollo2-<board>-${RELEASE_TAG}.bin
          \`\`\`

          (\`apollo2-debug-symbols-${RELEASE_TAG}.tar.gz\` is for developers:
          the .elf files inside decode crash dumps downloaded from a device's
          \`/coredump\` page.)
          EOF

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          # A -beta.N tag publishes as a pre-release and must NOT take the
          # "Latest" badge from the newest stable release.
          prerelease: ${{ contains(env.RELEASE_TAG, '-beta.') }}
          make_latest: ${{ !contains(env.RELEASE_TAG, '-beta.') }}
          files: |
            dist/*.bin
            dist/SHA256SUMS.txt
            dist/apollo2-debug-symbols-*.tar.gz
          body_path: dist/NOTES.md

  # Each release deploys into its own version directory (vX.Y.Z/firmware +
  # vX.Y.Z/manifests) and past versions are KEPT (keep_files) — the page's
  # version dropdown (fed by releases.json) can flash any of them. index.html,
  # releases.json and version.js are the only root files and are refreshed
  # every deploy; version.js always names the NEWEST version present (not this
  # run's tag), so re-running an old tag can't roll the page's default back.
  pages:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        continue-on-error: true  # first deploy: no gh-pages branch yet
        with:
          ref: gh-pages
          path: old

      - uses: actions/download-artifact@v8
        with:
          path: fw
          merge-multiple: true

      - name: Assemble site (page + versioned firmware + manifests)
        run: |
          mkdir -p "public/${RELEASE_TAG}/firmware" "public/${RELEASE_TAG}/manifests"
          cp site/index.html public/
          # notes.txt: this version's CHANGELOG section (same extraction as the
          # release notes). The on-device update check fetches it to show the
          # "what's new" text in its notification modal.
          section() {
            awk -v tag="$1" '
              $0 == "## " tag { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
          }
          section "${RELEASE_TAG}" > "public/${RELEASE_TAG}/notes.txt"
          BASE_TAG="${RELEASE_TAG%%-beta.*}"   # beta notes fall back to vX.Y.Z's
          if [ ! -s "public/${RELEASE_TAG}/notes.txt" ] && [ "$BASE_TAG" != "$RELEASE_TAG" ]; then
            section "${BASE_TAG}" > "public/${RELEASE_TAG}/notes.txt"
          fi
          cp fw/*.bin "public/${RELEASE_TAG}/firmware/"
          cp -r fw/parts "public/${RELEASE_TAG}/firmware/parts"
          # App-only images the on-device self-updater fetches.
          cp -r fw/app "public/${RELEASE_TAG}/firmware/app"
          python3 - <<'EOF'
          import json, os, glob, re
          tag = os.environ["RELEASE_TAG"]
          for path in glob.glob("fw/*.bin"):
              name = os.path.basename(path)
              chip = open(path + ".chip").read().strip()
              # apollo2-<board>-vX.Y.Z.bin -> board
              board = name[len("apollo2-"):name.rindex("-v")]
              # Flash the nvs-preserving parts, not the merged image: writing
              # the latter at offset 0 pads over the settings partition, which
              # made every web flash look like a factory reset.
              parts = json.load(open(f"fw/parts/{board}/parts.json"))
              manifest = {
                  "name": f"Apollo 2 ({board})",
                  "version": tag.lstrip("v"),
                  "new_install_prompt_erase": True,
                  "builds": [{
                      "chipFamily": chip,
                      "parts": [{"path": f"../firmware/parts/{board}/{p['path']}",
                                 "offset": p["offset"]} for p in parts],
                  }],
              }
              with open(f"public/{tag}/manifests/{board}.json", "w") as f:
                  json.dump(manifest, f, indent=2)

          # Release indexes: every version directory already on the site + this
          # one, newest first. keep_files below preserves the old directories
          # themselves.
          #
          # TWO files on purpose:
          #   releases.json      - RELEASES ONLY. Every fielded device reads it,
          #                        including firmware whose version parser reads
          #                        "0.14.0-beta.1" as 0.14.0 (plain sscanf takes
          #                        the numbers and ignores the tail). Put a beta
          #                        in here and those devices install it. Frozen.
          #   releases-beta.json - releases AND pre-releases, merged. A
          #                        beta-channel device reads just this one file
          #                        and still gets a stable release that lands
          #                        newer than the last beta.
          STABLE = re.compile(r"v\d+\.\d+\.\d+$")
          BETA = re.compile(r"v\d+\.\d+\.\d+-beta\.\d+$")

          def order_key(v):
              # Sorts a release ABOVE every beta of the same number
              # (0.14.0-beta.1 < 0.14.0-beta.2 < 0.14.0), matching the device's
              # semver_newer() in update_check.cpp.
              core, _, pre = v[1:].partition("-beta.")
              return [int(x) for x in core.split(".")] + ([0, int(pre)] if pre
                                                          else [1, 0])

          versions = {tag}
          if os.path.isdir("old"):
              for d in os.listdir("old"):
                  if (STABLE.fullmatch(d) or BETA.fullmatch(d)) and os.path.isdir(f"old/{d}"):
                      versions.add(d)
          ordered = sorted(versions, key=order_key, reverse=True)
          stable = [v for v in ordered if STABLE.fullmatch(v)]
          with open("public/releases.json", "w") as f:
              json.dump(stable, f, indent=2)
          with open("public/releases-beta.json", "w") as f:
              json.dump(ordered, f, indent=2)
          # The flasher's default stays the newest STABLE release, so publishing
          # a beta never changes what a first-time visitor flashes (the page's
          # "include pre-releases" box is how you get one on purpose).
          default = stable[0] if stable else ordered[0]
          with open("public/version.js", "w") as f:
              f.write(f'window.APOLLO2_VERSION = "{default}";\n')
          EOF

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true  # past version directories stay flashable
